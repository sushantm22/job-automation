search:
  # No roles are shipped: each person sets their own job titles during onboarding
  # (saved to config.local.yaml, which is gitignored). Discovery won't run until they exist.
  keywords: []
  locations: ["India", "Remote", "Bengaluru", "Bangalore", "Hyderabad", "Pune", "Mumbai", "Gurgaon", "Gurugram", "Noida", "Delhi", "Chennai"]
  exclude_keywords: ["intern", "unpaid"]
  min_match_score: 70
  max_job_age_days: 30       # Job boards (LinkedIn, Naukri, ...): drop/close jobs posted longer ago (0 = no limit)
  max_company_job_age_days: 60  # Company career sites/ATS data: listings there are still open, so a longer limit
  undated_jobs: first_seen   # Jobs without a posting date (Workday, SuccessFactors): first_seen | include
limits:
  max_applications_per_day: 15
  min_delay_seconds: 2
  max_delay_seconds: 6
mode:
  default: review
  headless: false
llm:
  max_calls_per_application: 6
  temperature: 0.2
tailoring:
  enabled: true
  cover_letter: false

discovery:
  tiers:
    tier1_direct_apis: true
    tier2_jobspy: true
    tier3_apify: true      # Smart fallback: only fires if JobSpy returns 0 Naukri results
    tier4_firecrawl: true   # Smart fallback: only fires for companies not covered by Tiers 1-2
  apify_api_token: ""       # Configured in .env as APIFY_API_TOKEN
  apify_actor_id: "valig/naukri-jobs-scraper"
  firecrawl_api_key: ""     # Configured in .env as FIRECRAWL_API_KEY
  firecrawl_daily_budget: 10  # Max portals per discovery run (1 credit each on free tier)
  jobspy:                     # Tier 2 job boards
    sites: [linkedin, indeed, naukri, glassdoor]
    results_per_search: 100   # per site, per role (LinkedIn returns 10 per page)
    linkedin_pause_seconds: 15  # LinkedIn blocks rapid bursts (HTTP 429); this paces the searches
  jobhive:                    # Free public dataset of company ATS jobs (storage.stapply.ai/jobs/v1); part of Tier 1
    enabled: true
    platforms: [workday, oracle, successfactors, icims, darwinbox, keka, smartrecruiters, phenom,
                greenhouse, lever, ashby, workable, zoho_recruit, amazon, eightfold, jibe]

notion:
  enabled: true
  api_token: ""             # Configured in .env as NOTION_API_KEY
  database_id: ""           # Configured in .env as NOTION_DATABASE_ID
  parent_page_id: ""        # Configured in .env as NOTION_PARENT_PAGE_ID
  auto_sync_on_discover: true
  max_sync_per_run: 200     # New rows pushed per discover run; `sync-notion` pushes the rest
